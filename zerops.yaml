zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start
      envVariables:
        # Cross-service refs: Zerops fills these from the "db" (postgresql) and
        # "cache" (valkey) project services below at deploy time. Confirm the
        # exact generated variable names for each service type in the Zerops
        # GUI before first deploy (postgresql typically exposes
        # ${db_connectionString}; valkey similarly exposes ${cache_connectionString}).
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        # GEMINI_API_KEY is set directly as a secret on the "app" service in the
        # Zerops GUI (Environment Variables tab) — not declared here since it has
        # no source to reference from another service.

# Managed services (add as project services in Zerops — provisioned separately
# from this app-level config, e.g. via the GUI "Import services" or
# `zcli project service-import`):
#   - hostname: db      type: postgresql@16
#   - hostname: cache    type: valkey@7.2
